# Images Docker de l'API et du site web, publiées sur le registre de GitHub (GHCR) après les tests :
#   ghcr.io/adanova83/organization-api   et   ghcr.io/adanova83/organization-web
#
# Étiquettes :
#   - version publiée (tag Git v1.2.3) : 1.2.3, 1.2 et latest  → ce que le serveur de production utilise ;
#   - branche main : main ; branche develop : develop (essais) ;
#   - toujours : sha-<commit>, pour revenir précisément à une construction.
#
# Publier une version : git tag v1.2.3 && git push origin v1.2.3
name: Images

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  images:
    name: Image ${{ matrix.app }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: Source/Application/Api/Dockerfile
          - app: web
            dockerfile: Source/Application/Web/Dockerfile

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Préparation de Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes et métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/adanova83/organization-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Organizations ${{ matrix.app }}
            org.opencontainers.image.description=Intranet de l'association Adanova 83 (${{ matrix.app }})
            org.opencontainers.image.licenses=CECILL-B

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
