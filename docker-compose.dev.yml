# Développement local sans Authentik : un faux serveur OIDC (mock-oauth2-server) remplace l'annuaire.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Le compte de test est défini dans dev/oidc-config.json (e-mail = ADMIN_EMAIL, groupe « authentik Admins » = toutes les permissions).
# Un second profil, « membre-test » (groupe « membres », lecture seule), sert à tester les droits limités : jeton par
#   client_credentials avec scope=membre, ou connexion interactive en saisissant ses claims.
# Ne jamais utiliser en production.
#
# L'adresse de l'annuaire doit être la même pour le navigateur et pour le conteneur de l'API (sinon l'émetteur du jeton
# ne correspond pas) : host.docker.internal, résolu par Docker Desktop (Windows/Mac) et par extra_hosts (Linux).
services:
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:latest
    restart: unless-stopped
    environment:
      JSON_CONFIG_PATH: /config/oidc-config.json
    volumes:
      - ./dev/oidc-config.json:/config/oidc-config.json:ro
    ports:
      - "8081:8080"

  api:
    depends_on:
      oidc:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      Oidc__Authority: http://host.docker.internal:8081/adanova
      Oidc__RequireHttpsMetadata: "false"
      # Le faux serveur accepte n'importe quel client ; ces valeurs ne servent qu'à activer la connexion web.
      Oidc__ClientId: organizations-web
      Oidc__ClientSecret: dev-secret
      # Profils de l'intranet (groupes Authentik). Administrateurs : groupe Admin__Group (toutes les permissions).
      # « membres » (profil de test « membre-test » de dev/oidc-config.json) : voir le planning et s'inscrire soi-même.
      Authorization__RolePermissions__membres__0: activity.read
      Authorization__RolePermissions__membres__1: event.read
      Authorization__RolePermissions__membres__2: project.read
      Authorization__RolePermissions__membres__3: space.read
      Authorization__RolePermissions__membres__4: organization.read
      # « animateurs » : comme les membres ; les participants de ce qu'ils animent s'ajoutent sans permission (API).
      Authorization__RolePermissions__animateurs__0: activity.read
      Authorization__RolePermissions__animateurs__1: event.read
      Authorization__RolePermissions__animateurs__2: project.read
      Authorization__RolePermissions__animateurs__3: space.read
      Authorization__RolePermissions__animateurs__4: organization.read
      # « responsables » : planning, inscriptions, fiches des membres (et contacts des familles), cotisations.
      Authorization__RolePermissions__responsables__0: activity.edit
      Authorization__RolePermissions__responsables__1: event.edit
      Authorization__RolePermissions__responsables__2: project.edit
      Authorization__RolePermissions__responsables__3: space.edit
      Authorization__RolePermissions__responsables__4: subscription.edit
      Authorization__RolePermissions__responsables__5: member.edit
      Authorization__RolePermissions__responsables__6: contribution.edit
      Authorization__RolePermissions__responsables__7: organization.read
